name: Generate Android keystore

# Run once, download the artifact, put its values into the repository secrets, then delete the artifact.
on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Generate keystore
        run: |
          set -euo pipefail
          mkdir -p out
          PASSWORD=$(openssl rand -base64 24 | tr -d '/+=' | cut -c1-24)
          keytool -genkeypair -keystore out/libretv-release.jks -storepass "$PASSWORD" -keypass "$PASSWORD" \
            -alias libretv -keyalg RSA -keysize 4096 -validity 36500 -dname "CN=LibreTV, O=LibreTV"
          base64 -w 0 out/libretv-release.jks > out/ANDROID_KEYSTORE.txt
          printf '%s' "$PASSWORD" > out/ANDROID_KEYSTORE_PASSWORD.txt
          printf '%s' "libretv" > out/ANDROID_KEY_ALIAS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: android-keystore
          path: out/*
          retention-days: 1
