[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
once_cell = "1.19.0" # For lazy static initialization
tauri = { version = "2", features = ["custom-protocol"] }
tauri-runtime = { version = "2" }
tauri-plugin-dialog = "2" # 本地视频文件选择（Android/桌面通用，Rust 侧 blocking_pick_file）
tauri-plugin-fs = "2"     # Android content:// 读取（本地视频 SAF URI 取 fd 流式传输）
urlencoding = "2.1.3"
scraper = "0.19.0"
# tauri-utils will be resolved by tauri and tauri-build
# tauri-plugin-log = { version = "2.0.0-rc.1", features = ["colored"] } # Temporarily commented out to ensure compilation
reqwest = { version = "0.11.27", features = ["json", "rustls-tls"], default-features = false } # 使用较新的 reqwest 版本
tokio = { version = "1.35", features = ["macros", "rt-multi-thread"] } # 使用较新的 tokio 版本
if-addrs = "0.13" # 枚举本机 IPv4 网卡：Windows 多网卡（WSL/VMware/VPN）下 SSDP 必须逐网卡发 M-SEARCH
mdns-sd = "0.5" # AirPlay 发现（mDNS / Bonjour，_airplay._tcp）
