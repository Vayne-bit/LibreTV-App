[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
# 与 tauri 2.12.x 家族的 MSRV 一致（tauri/tauri-utils/tauri-runtime-wry 2.12 均要求 1.90）。
# 声明过低会让 cargo 的 MSRV 感知解析器排除新版依赖，进而解析出
# tauri-runtime 与 tauri-runtime-wry 版本错配的组合（trait 缺失 + wry 签名不兼容）。
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
once_cell = "1.19.0" # For lazy static initialization
tauri = { version = "=2.12.5", features = ["custom-protocol"] }
tauri-runtime = { version = "=2.12.2" }
tauri-plugin-dialog = "=2.8.4" # 本地视频文件选择（Android/桌面通用，Rust 侧 blocking_pick_file）
tauri-plugin-fs = "=2.7.1"     # Android content:// 读取（本地视频 SAF URI 取 fd 流式传输）
urlencoding = "2.1.3"
scraper = "0.19.0"
# tauri-utils will be resolved by tauri and tauri-build
# tauri-plugin-log = { version = "2.0.0-rc.1", features = ["colored"] } # Temporarily commented out to ensure compilation
# 刻意不开 http2：reqwest 0.11 的 http2 是独立 feature（不在 rustls-tls 里，
# 依赖树里的 h2 只是 hyper-rustls 带的编译产物，ALPN 由 reqwest 自己的 feature 决定），
# 当前实际只协商 HTTP/1.1——这是 A/B 实测后的有意选择而非疏漏。
# A/B 实证（同一 CDN、6 个分片并行取流，scripts/ab-h1-vs-h2.mjs）：
#   h1 六条独立连接 = 1805ms / 3391KB/s；h2 单连接多路复用 = 23075ms / 265KB/s（慢 12.8 倍）
# 该 CDN 的 h2 单连接被限速（~95KB/s/流，与真机手机侧观测的 95KB/s 同量级），
# 多路复用把 6 路独立拥塞窗口合并成 1 路。要开 http2 前请先重跑该脚本对比。
reqwest = { version = "0.11.27", features = ["json", "rustls-tls"], default-features = false } # 使用较新的 reqwest 版本
tokio = { version = "1.35", features = ["macros", "rt-multi-thread"] } # 使用较新的 tokio 版本
if-addrs = "0.13" # 枚举本机 IPv4 网卡：Windows 多网卡（WSL/VMware/VPN）下 SSDP 必须逐网卡发 M-SEARCH
mdns-sd = "0.5" # AirPlay 发现（mDNS / Bonjour，_airplay._tcp）
